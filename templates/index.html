<!DOCTYPE html>
<html>
<head>
    <title>Student Performance</title>
</head>
<body>

<h2>Predict Math Score</h2>

<form action="/predict" method="post">

    <label>Gender:</label>
    <select name="gender">
        <option value="female">Female</option>
        <option value="male">Male</option>
    </select><br><br>

    <label>Race/Ethnicity:</label>
    <select name="race_ethnicity">
        <option value="group A">Group A</option>
        <option value="group B">Group B</option>
        <option value="group C">Group C</option>
        <option value="group D">Group D</option>
        <option value="group E">Group E</option>
    </select><br><br>

    <label>Parental Education:</label>
    <select name="parental_level_of_education">
        <option value="high school">High School</option>
        <option value="associate's degree">Associate</option>
        <option value="bachelor's degree">Bachelor</option>
        <option value="master's degree">Master</option>
    </select><br><br>

    <label>Lunch:</label>
    <select name="lunch">
        <option value="standard">Standard</option>
        <option value="free/reduced">Free/Reduced</option>
    </select><br><br>

    <label>Test Preparation:</label>
    <select name="test_preparation_course">
        <option value="none">None</option>
        <option value="completed">Completed</option>
    </select><br><br>

    <label>Reading Score:</label>
    <input type="number" name="reading_score" required><br><br>

    <label>Writing Score:</label>
    <input type="number" name="writing_score" required><br><br>

    <input type="submit" value="Predict">

</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
